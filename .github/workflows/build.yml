# ============================================================
# RakuOS Niri ISO — GitHub Actions
# ============================================================
# GitLab (gitlab.com/rakuos/iso/rakuos-niri-iso) is the source of truth and
# push-mirrors here. Builds start by hand (Actions › "Build niri ISO" ›
# Run workflow, pick the branch in "Use workflow from").
#
# Why GitHub: rakuos-forge's staging install (bootc install
# --composefs-backend) needs a kernel with EROFS and fs-verity and a
# running udev. GitLab's hosted runners have none of them; GitHub's runner
# VMs do. Same steps, names and uploads as the GitLab job
# build-iso-standard (the RakuOS server upload over ZeroTier is left out).
#
# Generated by rakuos-project/github-workflow-gen/iso/gen.py for all ISO
# repos; edit the template there, never one repo by hand.
#
# Secrets (org level):
#   CDN77_CDN_ID, CDN77_API_KEY, CDN77_ACCESS_KEY, CDN77_SECRET_KEY,
#   CDN77_BUCKET, CDN77_ENDPOINT_URL             dl.rakuos.org upload + purge
#   SOURCEFORGE_USERNAME, SOURCEFORGE_PASSWORD, SOURCEFORGE_HOST,
#   SOURCEFORGE_LATEST_PATH, SOURCEFORGE_ARCHIVE_ROOT   SourceForge upload
#   WEBSITE_CI_API_TOKEN, WEBSITE_HOST           rakuos.org ISO release notice

name: Build niri ISO

on:
  workflow_dispatch:
    inputs:
      sourceforge_upload:
        description: "Upload the ISO to SourceForge"
        type: choice
        options: ["true", "false"]
        default: "true"
      cdn77_upload:
        description: "Upload the latest ISO to CDN77 (dl.rakuos.org), main and staging only"
        type: choice
        options: ["true", "false"]
        default: "true"

concurrency:
  group: iso-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build niri ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Build and upload
        env:
          EDITION: "niri"
          IMAGE_REPO: "quay.io/rakuos/rakuos-niri"
          CDN77_PATH: "niri"
          SOURCEFORGE_DIR: "NIRI"
          FORGE_MODE: "standard"
          SOURCEFORGE_UPLOAD: ${{ inputs.sourceforge_upload }}
          CDN77_UPLOAD: ${{ inputs.cdn77_upload }}
          CDN77_CDN_ID: ${{ secrets.CDN77_CDN_ID }}
          CDN77_API_KEY: ${{ secrets.CDN77_API_KEY }}
          CDN77_ACCESS_KEY: ${{ secrets.CDN77_ACCESS_KEY }}
          CDN77_SECRET_KEY: ${{ secrets.CDN77_SECRET_KEY }}
          CDN77_BUCKET: ${{ secrets.CDN77_BUCKET }}
          CDN77_ENDPOINT_URL: ${{ secrets.CDN77_ENDPOINT_URL }}
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
          SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}
          SOURCEFORGE_HOST: ${{ secrets.SOURCEFORGE_HOST }}
          SOURCEFORGE_LATEST_PATH: ${{ secrets.SOURCEFORGE_LATEST_PATH }}
          SOURCEFORGE_ARCHIVE_ROOT: ${{ secrets.SOURCEFORGE_ARCHIVE_ROOT }}
        run: .github/scripts/run-iso.sh

      - name: Keep the checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rakuos-niri-iso-${{ github.ref_name }}-${{ github.run_id }}
          path: /mnt/iso/src/output/*.sha256
          if-no-files-found: ignore
          retention-days: 7

  notify-website:
    name: notify rakuos.org
    needs: [build]
    if: ${{ success() && (github.ref_name == 'main' || github.ref_name == 'rakuosel') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Post ISO release
        env:
          WEBSITE_CI_API_TOKEN: ${{ secrets.WEBSITE_CI_API_TOKEN }}
          WEBSITE_HOST: ${{ secrets.WEBSITE_HOST }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${BRANCH}" in
            main)     TAG="latest" ;;
            rakuosel) TAG="rakuosel" ;;
          esac
          PAYLOAD="{\"de\": \"niri\", \"version\": \"${TAG}.$(date -u +%Y%m%d)\"}"
          curl -sS -f -X POST -H "Authorization: Bearer ${WEBSITE_CI_API_TOKEN}" \
            -H "Content-Type: application/json" -d "${PAYLOAD}" \
            "http://${WEBSITE_HOST}:8080/api/iso-release"
