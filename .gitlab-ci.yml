spec:
  inputs:
    rakuos-server-upload:
      description: "Upload built ISOs to the RakuOS server over ZeroTier and SFTP"
      options:
        - "true"
        - "false"
      default: "false"
    sourceforge-upload:
      description: "Upload built ISOs to SourceForge"
      options:
        - "true"
        - "false"
      default: "true"
    cdn77-upload:
      description: "Upload latest ISOs to CDN77 (dl.rakuos.org) — stable branch only"
      options:
        - "true"
        - "false"
      default: "true"
---
# ============================================================
# RakuOS niri ISO — GitLab CI/CD Pipeline
# ============================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
      variables:
        JOB_IMAGE: "quay.io/centos/centos:stream10"
        BUILDER_DISTRO: "centos"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: always
      variables:
        JOB_IMAGE: "quay.io/fedora/fedora:latest"
        BUILDER_DISTRO: "fedora"
    - when: never

variables:
  IMAGE_REPO: "quay.io/rakuos/rakuos-niri"
  PLATFORM: "amd64"
  COMPRESSION: "squashfs"
  JOB_IMAGE: "quay.io/fedora/fedora:latest"
  BUILDER_DISTRO: "fedora"
  RAKUOS_SERVER_UPLOAD: "$[[ inputs.rakuos-server-upload ]]"
  SOURCEFORGE_UPLOAD: "$[[ inputs.sourceforge-upload ]]"
  SOURCEFORGE_ARCHIVE_PATH: "${SOURCEFORGE_ARCHIVE_ROOT}/NIRI"
  CDN77_UPLOAD: "$[[ inputs.cdn77-upload ]]"
  CDN77_PATH: "niri"

stages:
  - build

.iso-job:
  image: $JOB_IMAGE
  tags:
    - saas-linux-2xlarge-amd64
  before_script:
    - |
      set -euo pipefail
      dnf install -y \
        git \
        podman \
        jq \
        curl \
        findutils \
        tar \
        openssh-clients \
        sshpass \
        iproute \
        iputils \
        awscli
      curl -s https://install.zerotier.com | bash || true
      command -v zerotier-one >/dev/null
      command -v zerotier-cli >/dev/null
      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}")
          export BRANCH_SLUG="latest"
          export IS_STABLE="true"
          ;;
        "staging")
          export BRANCH_SLUG="staging"
          export IS_STABLE="false"
          ;;
        "next")
          export BRANCH_SLUG="next"
          export IS_STABLE="false"
          ;;
        "rawhide")
          export BRANCH_SLUG="rawhide"
          export IS_STABLE="false"
          ;;
        "rakuosel")
          export BRANCH_SLUG="rakuosel"
          export IS_STABLE="false"
          ;;
        *)
          export BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          export IS_STABLE="false"
          ;;
      esac
      export BUILD_DATE="$(date -u +%Y.%m.%d)"
      echo "Using image tag: ${BRANCH_SLUG}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "next"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

build-iso-standard:
  extends: .iso-job
  stage: build
  script:
    - |
      set -euo pipefail
      export IMAGE_REF="${IMAGE_REPO}:${BRANCH_SLUG}"
      rpm --import https://repo.rakuos.org/pubkey.gpg
      dnf -y config-manager addrepo --from-repofile=https://repo.rakuos.org/rakuos.repo
      dnf install -y rakuos-forge
      export RAKUFORGE_BUILDER_DISTRO="${BUILDER_DISTRO}"
      export HOOK_post_rootfs="${CI_PROJECT_DIR}/config/configure-iso.sh"
      export HOOK_pre_initramfs="${CI_PROJECT_DIR}/config/pre_initramfs.sh"
      rakuos-forge build "${IMAGE_REF}" --compression "${COMPRESSION}" --container-image "${IMAGE_REF}"
      mkdir -p output
      if [[ "${IS_STABLE}" == "true" ]]; then
        export NEW_ISO_NAME="rakuos-niri-${BUILD_DATE}-${PLATFORM}.iso"
        export LATEST_ISO_NAME="rakuos-niri-latest-${PLATFORM}.iso"
      else
        export NEW_ISO_NAME="rakuos-niri-${BRANCH_SLUG}-${BUILD_DATE}-${PLATFORM}.iso"
        export LATEST_ISO_NAME="rakuos-niri-${BRANCH_SLUG}-latest-${PLATFORM}.iso"
      fi
      ISO_PATH="output.iso"
      [[ -f "${ISO_PATH}" ]] || { echo "ERROR: ISO output not found"; ls -la . || true; exit 1; }
      mv "${ISO_PATH}" "output/${NEW_ISO_NAME}"
      sha256sum "output/${NEW_ISO_NAME}" > "output/${NEW_ISO_NAME}.sha256"
      if [[ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]]; then
        cp "output/${NEW_ISO_NAME}" "output/${LATEST_ISO_NAME}"
        sha256sum "output/${LATEST_ISO_NAME}" > "output/${LATEST_ISO_NAME}.sha256"
        if [[ "${RAKUOS_SERVER_UPLOAD}" == "true" ]]; then
          ls -l /dev/net/tun || true
          zerotier-one -d
          zerotier-cli info || true
          for _ in $(seq 1 30); do
            [[ -f /var/lib/zerotier-one/identity.public ]] && break
            sleep 1
          done
          zerotier-cli listnetworks || true
          ZT_NODE_ID="$(cut -d: -f1 /var/lib/zerotier-one/identity.public)"
          zerotier-cli join "${ZEROTIER_NETWORK_ID}"
          curl -fsS -X POST \
            -H "Authorization: token ${ZEROTIER_CENTRAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"config":{"authorized":true}}' \
            "https://api.zerotier.com/api/v1/network/${ZEROTIER_NETWORK_ID}/member/${ZT_NODE_ID}"
          for _ in $(seq 1 30); do
            zerotier-cli listnetworks | grep -q "${ZEROTIER_NETWORK_ID}.*OK" && break
            sleep 2
          done
          sleep 10
          ip addr show
          ping -c 3 "${SFTP_HOST}"
          sshpass -p "${SFTP_PASSWORD}" ssh -o StrictHostKeyChecking=no "${SFTP_USERNAME}@${SFTP_HOST}" "\
            mkdir -p '${SFTP_TARGET}' && \
            cd '${SFTP_TARGET}' && \
            rm -f '${NEW_ISO_NAME}' '${LATEST_ISO_NAME}'"
          sshpass -p "${SFTP_PASSWORD}" scp -o StrictHostKeyChecking=no \
            "output/${NEW_ISO_NAME}" \
            "output/${LATEST_ISO_NAME}" \
            "${SFTP_USERNAME}@${SFTP_HOST}:${SFTP_TARGET}/"
          echo "Removing runner from ZeroTier network..."
          curl -fsS -X DELETE \
            -H "Authorization: token ${ZEROTIER_CENTRAL_TOKEN}" \
            "https://api.zerotier.com/api/v1/network/${ZEROTIER_NETWORK_ID}/member/${ZT_NODE_ID}" || true
          zerotier-cli leave "${ZEROTIER_NETWORK_ID}" || true
        else
          echo "RakuOS server upload disabled; skipping ZeroTier and SFTP upload."
        fi
        if [[ "${CDN77_UPLOAD}" == "true" ]] && { [[ "${IS_STABLE}" == "true" ]] || [[ "${BRANCH_SLUG}" == "staging" ]]; }; then
          echo "Purging CDN77 cache for ${CDN77_PATH}/${LATEST_ISO_NAME}..."
          curl -fsS -X POST "https://api.cdn77.com/v3/cdn/${CDN77_CDN_ID}/job/purge/paths" \
            -H "Authorization: Bearer ${CDN77_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"paths\": [\"/${CDN77_PATH}/${LATEST_ISO_NAME}\", \"/${CDN77_PATH}/${LATEST_ISO_NAME}.sha256\"]}" || true
          echo "Waiting 120s for CDN cache to clear..."
          sleep 120
          echo "Aborting any stranded multipart uploads for ${CDN77_PATH}/${LATEST_ISO_NAME}..."
          # A prior job that got retried/cancelled/timed out mid-upload can
          # leave an incomplete multipart upload sitting on CDN77 for this
          # same key. CDN77 (unlike AWS S3 itself) then rejects a fresh
          # upload's CompleteMultipartUpload with "This multipart completion
          # is already in progress" — there's nothing wrong with *this*
          # upload, it's colliding with that leftover session. Clear out any
          # such stale upload IDs for this key before starting a new one.
          # (--query returns the literal string "None", not empty output,
          # when there are no Uploads at all — filter that out too, or
          # abort-multipart-upload gets called with an empty --upload-id.)
          AWS_ACCESS_KEY_ID="${CDN77_ACCESS_KEY}" AWS_SECRET_ACCESS_KEY="${CDN77_SECRET_KEY}" \
            aws s3api list-multipart-uploads \
              --bucket "${CDN77_BUCKET}" --prefix "${CDN77_PATH}/${LATEST_ISO_NAME}" \
              --endpoint-url "${CDN77_ENDPOINT_URL}" \
              --query "Uploads[].UploadId" --output text 2>/dev/null \
            | tr '\t' '\n' \
            | while read -r upload_id; do
                [[ -z "${upload_id}" || "${upload_id}" == "None" ]] && continue
                echo "Aborting stranded multipart upload ${upload_id}..."
                AWS_ACCESS_KEY_ID="${CDN77_ACCESS_KEY}" AWS_SECRET_ACCESS_KEY="${CDN77_SECRET_KEY}" \
                  aws s3api abort-multipart-upload \
                    --bucket "${CDN77_BUCKET}" --key "${CDN77_PATH}/${LATEST_ISO_NAME}" \
                    --upload-id "${upload_id}" --endpoint-url "${CDN77_ENDPOINT_URL}" || true
              done
          # Even with no listable stranded upload, CDN77 has been observed
          # to reject a CompleteMultipartUpload as "already in progress" on
          # the very first attempt — almost certainly a still-settling
          # server-side state from the purge/delete above, not anything
          # this job did wrong. That's transient, so retry the upload
          # itself a few times with a short backoff rather than failing the
          # whole job over what clears up on its own a few seconds later.
          cdn77_upload_with_retry() {
            local src="$1" dest="$2" attempt=1 max_attempts=5
            while true; do
              if AWS_ACCESS_KEY_ID="${CDN77_ACCESS_KEY}" AWS_SECRET_ACCESS_KEY="${CDN77_SECRET_KEY}" \
                   aws s3 cp "${src}" "s3://${CDN77_BUCKET}/${dest}" \
                     --endpoint-url "${CDN77_ENDPOINT_URL}" --no-progress; then
                return 0
              fi
              if [[ "${attempt}" -ge "${max_attempts}" ]]; then
                echo "CDN77 upload of ${dest} failed after ${attempt} attempts."
                return 1
              fi
              echo "CDN77 upload of ${dest} failed (attempt ${attempt}/${max_attempts}), retrying in 20s..."
              attempt=$((attempt + 1))
              sleep 20
            done
          }
          echo "Uploading latest ISO to CDN77 (dl.rakuos.org/${CDN77_PATH})..."
          cdn77_upload_with_retry "output/${LATEST_ISO_NAME}" "${CDN77_PATH}/${LATEST_ISO_NAME}"
          cdn77_upload_with_retry "output/${LATEST_ISO_NAME}.sha256" "${CDN77_PATH}/${LATEST_ISO_NAME}.sha256"
          echo "CDN77 upload complete."
        else
          echo "CDN77 upload disabled or non-stable branch; skipping."
        fi
        if [[ "${SOURCEFORGE_UPLOAD}" == "true" ]]; then
          sshpass -p "${SOURCEFORGE_PASSWORD}" scp -o StrictHostKeyChecking=no \
            "output/${LATEST_ISO_NAME}" \
            "${SOURCEFORGE_USERNAME}@${SOURCEFORGE_HOST}:${SOURCEFORGE_LATEST_PATH}/${LATEST_ISO_NAME}"
          sshpass -p "${SOURCEFORGE_PASSWORD}" scp -o StrictHostKeyChecking=no \
            "output/${NEW_ISO_NAME}" \
            "${SOURCEFORGE_USERNAME}@${SOURCEFORGE_HOST}:${SOURCEFORGE_ARCHIVE_PATH}/${NEW_ISO_NAME}"
        else
          echo "SourceForge upload disabled; skipping ISO upload."
        fi
      fi
  artifacts:
    name: "rakuos-niri-${CI_COMMIT_REF_SLUG}-standard-${CI_PIPELINE_ID}"
    paths:
      - output/*.sha256
    expire_in: 7 days

notify-discord:
  stage: build
  image: curlimages/curl:latest
  needs:
    - job: build-iso-standard
  script:
    - |
      set -euo pipefail
      : "${WEBSITE_CI_API_TOKEN:?set WEBSITE_CI_API_TOKEN in CI/CD variables}"
      : "${WEBSITE_HOST:?set WEBSITE_HOST in CI/CD variables}"
      DATE_TAG="$(date -u +%Y%m%d)"

      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}") TAG="latest"    ;;
        "rakuosel")             TAG="rakuosel"  ;;
        *) echo "No ISO release notification for branch '${CI_COMMIT_BRANCH}', skipping."; exit 0 ;;
      esac
      VERSION="${TAG}.${DATE_TAG}"

      PAYLOAD="{\"de\": \"${CDN77_PATH}\", \"version\": \"${VERSION}\"}"
      curl -sS -f -X POST -H "Authorization: Bearer ${WEBSITE_CI_API_TOKEN}" -H "Content-Type: application/json" -d "${PAYLOAD}" "http://${WEBSITE_HOST}:8080/api/iso-release"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
      when: on_success
    - when: never
